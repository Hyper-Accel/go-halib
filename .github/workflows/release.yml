name: release

# Tag-driven release. `git tag vX.Y.Z && git push origin vX.Y.Z` validates the
# tagged commit and cuts a GitHub release with auto-generated notes. go-halib is
# a library: consumers (ha-ctk, ha-device-plugin) fetch the module directly from
# the tag via the Go module proxy, so there is no artifact to build or publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: runner-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
