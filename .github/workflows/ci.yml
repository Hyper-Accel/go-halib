name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build / vet / test (noop)
    runs-on: runner-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      # noop path only: the hyperdriver CGO backend needs ha_driver.h + libha_driver.so
      # (provided by the SDK build image), so it is exercised by the consumer CI, not here.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
